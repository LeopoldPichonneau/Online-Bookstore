<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Distributed Bookstore — microservices checkout system">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9f9f9"/><stop offset="1" stop-color="#f6f6f6"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a87714"/><stop offset=".5" stop-color="#a87714"/><stop offset="1" stop-color="#a87714"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#000000" stroke-opacity="0.06"/></pattern>
    <clipPath id="type"><rect class="reveal" x="60" y="58" height="82" width="0"/></clipPath>
    <clipPath id="card"><rect width="1000" height="250" rx="22"/></clipPath></defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .reveal { animation: type 1.6s steps(21, end) .4s forwards; }
    @keyframes type { to { width: 655px; } }
    .cursor { animation: move 1.6s steps(21, end) .4s forwards, blink 1s steps(1) 2s infinite; }
    @keyframes move { to { transform: translateX(647px); } }
    @keyframes blink { 50% { opacity: 0; } }
    .a1 { animation: d1 14s ease-in-out infinite alternate; } .a2 { animation: d2 17s ease-in-out infinite alternate; }
    @keyframes d1 { to { transform: translate(240px, 50px) } } @keyframes d2 { to { transform: translate(-280px, -30px) } }
    .tag { opacity: 0; animation: fi 1s ease 2s forwards; } @keyframes fi { to { opacity: 1 } }
    .chips { opacity: 0; animation: fi 1s ease 2.4s forwards; }
  </style>
  <g clip-path="url(#card)">
    <rect width="1000" height="250" fill="url(#bg)"/>
    <g filter="url(#blur)"><circle class="a1" cx="140" cy="80" r="110" fill="#a87714" fill-opacity="0.25"/><circle class="a2" cx="840" cy="200" r="130" fill="#a87714" fill-opacity="0.28"/></g>
    <rect width="1000" height="250" fill="url(#grid)"/>
    <text x="60" y="52" font-size="14" fill="#6b6b6b">~/<tspan fill="#a87714">Online-Bookstore</tspan> <tspan fill="#a87714">$</tspan><tspan fill="#222222"> cat README.md</tspan></text>
    <g clip-path="url(#type)"><text x="60" y="118" font-size="52" font-weight="800" textLength="655" lengthAdjust="spacingAndGlyphs" fill="url(#ink)">Distributed Bookstore</text></g>
    <rect class="cursor" x="60" y="74" width="9" height="46" rx="2" fill="#a87714"/>
    <text class="tag" x="60" y="160" font-size="17" fill="#222222">Microservices checkout with vector clocks, 2PC and leader election.</text>
    <g class="chips"><g transform="translate(60 196)"><rect width="76" height="30" rx="15" fill="#f5f5f5" stroke="#e0e0e0"/><circle cx="15" cy="15" r="3.5" fill="#a87714"/><text x="26" y="20" font-size="12" fill="#222222">Python</text></g><g transform="translate(146 196)"><rect width="60" height="30" rx="15" fill="#f5f5f5" stroke="#e0e0e0"/><circle cx="15" cy="15" r="3.5" fill="#a87714"/><text x="26" y="20" font-size="12" fill="#222222">gRPC</text></g><g transform="translate(216 196)"><rect width="76" height="30" rx="15" fill="#f5f5f5" stroke="#e0e0e0"/><circle cx="15" cy="15" r="3.5" fill="#a87714"/><text x="26" y="20" font-size="12" fill="#222222">Docker</text></g><g transform="translate(302 196)"><rect width="68" height="30" rx="15" fill="#f5f5f5" stroke="#e0e0e0"/><circle cx="15" cy="15" r="3.5" fill="#a87714"/><text x="26" y="20" font-size="12" fill="#222222">Flask</text></g><g transform="translate(380 196)"><rect width="53" height="30" rx="15" fill="#f5f5f5" stroke="#e0e0e0"/><circle cx="15" cy="15" r="3.5" fill="#a87714"/><text x="26" y="20" font-size="12" fill="#222222">2PC</text></g><g transform="translate(442 196)"><rect width="129" height="30" rx="15" fill="#f5f5f5" stroke="#e0e0e0"/><circle cx="15" cy="15" r="3.5" fill="#a87714"/><text x="26" y="20" font-size="12" fill="#222222">Vector clocks</text></g><g transform="translate(581 196)"><rect width="136" height="30" rx="15" fill="#f5f5f5" stroke="#e0e0e0"/><circle cx="15" cy="15" r="3.5" fill="#a87714"/><text x="26" y="20" font-size="12" fill="#222222">Bully election</text></g></g>
  </g>
</svg>