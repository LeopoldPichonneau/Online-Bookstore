<svg xmlns="http://www.w3.org/2000/svg" width="760" height="184" viewBox="0 0 760 184" role="img" aria-label="Step 1: Add your API key (optional)">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e0b14f"/><stop offset="1" stop-color="#e0b14f"/></linearGradient></defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .l { white-space: pre; opacity: 0; animation: show 14s linear infinite; }
    @keyframes show { 0% {opacity:0; transform: translateX(-8px)} 3% {opacity:1; transform:none} 90% {opacity:1} 96%,100% {opacity:0} }
    .p { fill:#e0b14f } .c { fill:#e0b14f } .o { fill:#eeeeee } .m { fill:#9e9e9e } .k { fill:#e0b14f }
    .cur { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0 } }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; } @keyframes spin { to { transform: rotate(360deg) } }
    .bar { transform-box: fill-box; transform-origin: 0 50%; animation: prog 14s linear infinite; } @keyframes prog { from { transform: scaleX(0) } 85%,100% { transform: scaleX(1) } }
  </style>
  <rect x="1" y="1" width="758" height="182" rx="18" fill="#0d0d0d" stroke="#3b3b3b"/>
  <rect x="1" y="1" width="758" height="182" rx="18" fill="none" stroke="url(#g)" stroke-opacity=".0"/>
  <circle class="ring" cx="48" cy="48" r="27" fill="none" stroke="#e0b14f" stroke-opacity=".6" stroke-dasharray="3 6"/>
  <circle cx="48" cy="48" r="20" fill="#e0b14f" fill-opacity=".12"/>
  <text x="48" y="54" font-size="17" font-weight="800" text-anchor="middle" fill="#e0b14f">1</text>
  <text x="92" y="44" font-size="20" font-weight="800" fill="#eeeeee">Add your API key (optional)</text>
  <text x="92" y="66" font-size="13" fill="#9e9e9e">Suggestions use Google Gemma 3 — without a key they fall back to a static list</text>
  <text x="732" y="40" font-size="11" letter-spacing="2" text-anchor="end" fill="#9e9e9e">STEP 1 / 4</text>
  <rect x="636" y="50" width="96" height="4" rx="2" fill="#191919"/><rect class="bar" x="636" y="50" width="24" height="4" rx="2" fill="url(#g)"/>
  <rect x="24" y="96" width="712" height="74" rx="12" fill="#0c0c0c" stroke="#3b3b3b"/>
  <text class="l" style="animation-delay:0.5s" x="44" y="126" font-size="14"><tspan class="m"># from https://aistudio.google.com/apikey</tspan></text>
<text class="l" style="animation-delay:1.2s" x="44" y="150" font-size="14"><tspan class="p">$</tspan> <tspan class="c">export GOOGLE_API_KEY=your_actual_api_key_here</tspan></text>
</svg>